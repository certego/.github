name: Reusable python linter workflow
on:
  workflow_call:
    inputs:
      # Base configs
      python_versions:
        description: Python versions to use (in the form of a JSON array)
        type: string
        required: true
      ubuntu_version:
        description: Ubuntu version to use
        type: string
        default: latest
        required: false
      working_directory:
        description: Directory that must be run against the linters
        type: string
        required: true
      requirements_path:
        description: Path to the requirements.txt file
        type: string
        required: true
      install_from:
        description: Directory that must be used to install the packages
        type: string
        required: false
        default: .
      packages_path:
        description: Path to the packages.txt file (APT requirements)
        type: string
        required: false
      env:
        description: Environment variables to set
        type: string
        required: false
        default: >-
          {}
      max_timeout:
        description: Max time that the CI can be run
        type: number
        required: false
        default: 30
      run_tests:
        description: Run linters, CodeQL, docs, migrations check, tests and coverage. When false only installs requirements and warms the caches.
        type: boolean
        required: false
        default: true
      cache_key:
        description: >
          Prefix of the venv and APT cache keys. Empty keeps the per-ref behaviour (PR ref, then base_ref fallback).
          Set (e.g. `ci`) to share one cache across refs, warmed by a default-branch push with run_tests false.
        type: string
        required: false
        default: ''

      # Formatters
      use_black:
        description: Use black formatter
        type: boolean
        required: false
      use_isort:
        description: Use isort formatter
        type: boolean
        required: false
      use_ruff_formatter:
        description: Use ruff formatter
        type: boolean
        required: false

      # Linters
      use_autoflake:
        description: Use autoflake linter
        type: boolean
        required: false
      use_bandit:
        description: Use bandit linter
        type: boolean
        required: false
      use_flake8:
        description: Use flake8 linter
        type: boolean
        required: false
      use_pylint:
        description: Use pylint linter
        type: boolean
        required: false
      use_ruff_linter:
        description: Use ruff linter
        type: boolean
        required: false

      # Coverage configs
      use_coverage:
        description: Use coverage.py.
        type: boolean
        required: false
      coverage_config_path:
        description: Path to the coverage.py config file
        type: string
        required: false
        default: .coveragerc
      upload_coverage:
        description: Upload coverage.py report to github
        type: boolean
        required: false

      # CodeQL configs
      run_codeql:
        description: Run codeql
        type: boolean
        required: false
      
      # Services
      use_celery:
        description: Create a celery worker
        type: boolean
        required: false
      use_elastic_search:
        description: Use elastic_search service
        type: boolean
        required: false
      use_memcached:
        description: Use memcached service
        type: boolean
        required: false
      use_mongo:
        description: Use mongo service
        type: boolean
        required: false
      use_postgres:
        description: Use postgres service
        type: boolean
        required: false
      use_rabbitmq:
        description: Use rabbitmq service
        type: boolean
        required: false
      use_redis:
        description: Use redis service
        type: boolean
        required: false

      # Services configs
      ## Celery service configs
      celery_app:
        description: Celery app name. Requires use_celery to be true
        type: string
        required: false
      celery_queues:
        description: Celery queues separated by ,. Requires use_celery to be true
        type: string
        required: false
        default: default
      ## Elasticsearch service configs
      elasticsearch_version:
        description: Elasticsearch container version
        type: string
        required: false
        default: latest
      elasticsearch_port:
        description: Elasticsearch container port
        type: string
        required: false
        default: 9200
      ## Memcached service configs
      memcached_version:
        description: Memcached alpine container version
        type: string
        required: false
        default: latest
      ## Mongo service configs
      mongo_version:
        description: Mongo container version
        type: string
        required: false
        default: latest
      ## Postgres service configs
      postgres_db:
        description: Postgres service db. Requires use_postgres to be true
        type: string
        required: false
        default: db
      postgres_user:
        description: Postgres service user. Requires use_postgres to be true
        type: string
        required: false
        default: user
      postgres_password:
        description: Postgres service password. Requires use_postgres to be true
        type: string
        required: false
        default: password
      postgres_version:
        description: Postgres service version. Requires use_postgres to be true
        type: string
        required: false
        default: latest
      ## RabbitMQ service configs
      rabbitmq_version:
        description: RabbitMQ management-alpine container version
        type: string
        required: false
        default: latest
      ## Redis service configs
      redis_version:
        description: Redis alpine container version
        type: string
        required: false
        default: latest
      

      # Django configs
      use_db_snapshot:
        description: Cache a pg_dump of the migrated database keyed on the migration files and run tests with --keepdb. Requires use_postgres and django_settings_module.
        type: boolean
        required: false
        default: false
      django_settings_module:
        description: Path to the django settings file
        type: string
        required: false
      check_migrations:
        description: Check if migrations are valid. Require django_settings_module to be set.
        type: boolean
        required: false
      check_requirements_licenses:
        description: Check if requirements have a valid license. Require django_settings_module to be set.
        type: boolean
        required: false
        default: true
      ignore_requirements_licenses_regex:
        description: Regex of repositories of which ignore license
        type: string
        required: false
        default: uWSGI.*|lunardate.*|.*QuokkaClient.*|pyquokka.*
      tags_for_slow_tests:
        description: Tags for tests that will be run only on master/main branch, space separated. Can be used only for django projects.
        default: slow
        type: string
        required: false
      tags_for_manual_tests:
        description: Tags for tests that will not be run on the CI, space separated. Can be used only for django projects.
        default: manual
        type: string
        required: false
      test_parallelism:
        description: >
          Value passed to `manage.py test --parallel` (e.g. `auto` or a number). Empty, the default, runs serially.
          Opt in only if the suite is parallel-safe: workers get their own cloned database but share every other service.
          Can be used only for django projects.
        default: ''
        type: string
        required: false

      # Misc configs
      custom_command:
        description: String of custom command to run
        type: string
        required: false

      check_docs_directory:
        description: Check docs using rstcheck inside this directory
        type: string
        required: false
      check_dockerfile:
        description: Check dockerfile build. WARNING action total time may increase significantly
        type: string
        required: false

jobs:
  # Own job: a Docker action's image is built at job setup even when the step's `if` is false.
  licenses:
    name: Check requirements licenses
    if: inputs.check_requirements_licenses
    runs-on: ubuntu-${{ inputs.ubuntu_version }}
    steps:
      - name: Check out latest commit
        uses: actions/checkout@v5

      - name: Check requirements licenses
        id: license_check_report
        continue-on-error: true
        uses: pilosus/action-pip-license-checker@v2
        with:
          requirements: ${{ inputs.install_from }}/${{ inputs.requirements_path }}
          exclude: ${{ inputs.ignore_requirements_licenses_regex }}
          headers: true
          fail: 'StrongCopyleft,NetworkCopyleft,Error'
          fails-only: true

      - name: Print wrong licenses
        if: steps.license_check_report.outcome == 'failure'
        run: |
          echo "License check failed"
          echo "===================="
          echo "${{ steps.license_check_report.outputs.report }}"
          echo "===================="
          exit 1
        shell: bash

  python:
    name: Run python test suite
    runs-on: ubuntu-${{ inputs.ubuntu_version }}
    timeout-minutes: ${{ inputs.max_timeout }}
    strategy:
      matrix:
        python_version: ${{ fromJson(inputs.python_versions) }}
        language: ['python']
    env: ${{ fromJson(inputs.env) }}
    steps:
      - name: Check out latest commit
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}

      - name: Inject stuff to environment
        run: |
          if [[ '${{ inputs.django_settings_module}}' != 'false' ]]; then
            echo "PYTHONPATH=${{ github.workspace }}/${{ inputs.working_directory }}" >> $GITHUB_ENV
            echo "DJANGO_SETTINGS_MODULE=${{ inputs.django_settings_module }}" >> $GITHUB_ENV
          fi
          if [[ '${{ inputs.run_codeql}}' != 'false' ]]; then
            echo "CODEQL_PYTHON=$(which python)" >> $GITHUB_ENV
          fi
        shell:
          bash

      - name: Restore APT cache related to PR event
        id: restore_apt_cache_pr
        uses: ./.github/actions/apt_requirements/restore_apt_cache
        with:
          apt_requirements_file_path: ${{ inputs.packages_path }}
          git_reference: ${{ inputs.cache_key || github.ref_name }}
      
      - name: Restore APT cache related to target branch
        id: restore_apt_cache_target_branch
        if: steps.restore_apt_cache_pr.outputs.cache-hit != 'true' && inputs.cache_key == ''
        uses: ./.github/actions/apt_requirements/restore_apt_cache
        with:
          apt_requirements_file_path: ${{ inputs.packages_path }}
          git_reference: ${{ github.base_ref }}
      
      # Always refresh the APT index. Skipping this on an APT cache hit left a
      # stale index, so `apt-get install` returned 404 when a pinned package
      # version was rotated out of the mirror. The update is cheap; the cache
      # still serves the .deb downloads.
      - name: Refresh APT repositories
        run: |
          sudo apt-get update
        shell: bash

      - name: Install APT requirements
        run: |
          sudo apt-get install -y --no-install-recommends $(tr '\n' ' ' < ${{ inputs.packages_path }})
        shell: bash
      
      - name: Save APT cache related to PR event
        if: >
          steps.restore_apt_cache_pr.outputs.cache-hit != 'true'
        uses: ./.github/actions/apt_requirements/save_apt_cache
        with:
          apt_requirements_file_path: ${{ inputs.packages_path }}
          git_reference: ${{ inputs.cache_key || github.ref_name }}

      - name: Create linter requirements file
        uses: ./.github/actions/python_requirements/create_linter_requirements_file
        with:
          install_from: ${{ inputs.install_from }}
          django_settings_module: ${{ inputs.django_settings_module }}
          use_autoflake: ${{ inputs.use_autoflake }}
          use_bandit: ${{ inputs.use_bandit }}
          use_black: ${{ inputs.use_black }}
          use_flake8: ${{ inputs.use_flake8 }}
          use_isort: ${{ inputs.use_isort }}
          use_pylint: ${{ inputs.use_pylint }}
          use_ruff_formatter: ${{ inputs.use_ruff_formatter }}
          use_ruff_linter: ${{ inputs.use_ruff_linter }}

      - name: Create dev requirements file
        uses: ./.github/actions/python_requirements/create_dev_requirements_file
        with:
          install_from: ${{ inputs.install_from }}
          use_coverage: ${{ inputs.use_coverage }}

      - name: Create docs requirements file
        uses: ./.github/actions/python_requirements/create_docs_requirements_file
        with:
          install_from: ${{ inputs.install_from }}
          check_docs_directory: ${{ inputs.check_docs_directory }}
          django_settings_module: ${{ inputs.django_settings_module }}

      # setup-uv's `activate-environment` runs `uv venv --clear`, so the venv restore must come after it.
      - name: Install uv
        uses: astral-sh/setup-uv@v7.3.1
        with:
          python-version: ${{ matrix.python_version }}
          activate-environment: "true"
          github-token: ${{ github.token }}
          # Off: the venv cache is the fast path, and on a venv hit the uv cache post step fails on a missing dir.
          enable-cache: "false"

      - name: Restore Python virtual environment related to PR event
        id: restore_python_virtual_environment_pr
        uses: ./.github/actions/python_requirements/restore_virtualenv/
        with:
          requirements_paths: "${{ inputs.requirements_path }} requirements-linters.txt requirements-dev.txt requirements-docs.txt"
          git_reference: ${{ inputs.cache_key || github.ref_name }}

      - name: Restore Python virtual environment related to target branch
        id: restore_python_virtual_environment_target_branch
        if: steps.restore_python_virtual_environment_pr.outputs.cache-hit != 'true' && inputs.cache_key == ''
        uses: ./.github/actions/python_requirements/restore_virtualenv/
        with:
          requirements_paths: ${{ inputs.requirements_path }}
          git_reference: ${{ github.base_ref }}

      # Only on a venv miss: the install can fill the runner disk, and the rm costs 30-70s.
      - name: Free disk space
        if: >
          steps.restore_python_virtual_environment_pr.outputs.cache-hit != 'true' &&
          steps.restore_python_virtual_environment_target_branch.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
        shell: bash

      - name: Install project requirements
        if: >
          steps.restore_python_virtual_environment_pr.outputs.cache-hit != 'true' &&
          steps.restore_python_virtual_environment_target_branch.outputs.cache-hit != 'true'
        run: uv pip install -r ${{ inputs.requirements_path }}
        shell: bash
        working-directory: ${{ inputs.install_from }}

      - name: Install other requirements
        if: >
          steps.restore_python_virtual_environment_pr.outputs.cache-hit != 'true'
        run: |
          uv pip install -r requirements-dev.txt
          uv pip install -r requirements-linters.txt
          uv pip install -r requirements-docs.txt
        shell: bash
        working-directory: ${{ inputs.install_from }}

      - name: Save Python virtual environment related to PR event
        if: >
          steps.restore_python_virtual_environment_pr.outputs.cache-hit != 'true'
        uses: ./.github/actions/python_requirements/save_virtualenv
        with:
          requirements_paths: "${{ inputs.requirements_path }} requirements-linters.txt requirements-dev.txt requirements-docs.txt"
          git_reference: ${{ inputs.cache_key || github.ref_name }}

      - name: Run linters
        uses: ./.github/actions/python_linter
        if: >
          inputs.run_tests && (
          inputs.use_black ||
          inputs.use_isort ||
          inputs.use_flake8 ||
          inputs.use_pylint ||
          inputs.use_bandit ||
          inputs.use_autoflake ||
          inputs.use_ruff_formatter ||
          inputs.use_ruff_linter )
        with:
          working_directory: ${{ inputs.working_directory }}
          use_black: ${{ inputs.use_black }}
          use_isort: ${{ inputs.use_isort }}
          use_flake8: ${{ inputs.use_flake8 }}
          use_pylint: ${{ inputs.use_pylint }}
          use_bandit: ${{ inputs.use_bandit }}
          use_autoflake: ${{ inputs.use_autoflake }}
          use_ruff_formatter: ${{ inputs.use_ruff_formatter }}
          use_ruff_linter: ${{ inputs.use_ruff_linter }}

      - name: Run CodeQL
        if: inputs.run_tests && inputs.run_codeql
        uses: ./.github/actions/codeql
        with:
          language: python
          working_directory: ${{ inputs.working_directory }}

      - name: Build Docs
        if: inputs.run_tests && inputs.check_docs_directory
        run: |
          rstcheck -r  --report-level error --ignore-directives automodule,autoclass .
          python3 -m sphinx -a -T -E -b html -d  _build/doctrees -D language=en . _build/html
        shell: bash
        working-directory: ${{ inputs.check_docs_directory }}

      - name: Start services
        uses: ./.github/actions/services
        if: inputs.use_postgres || inputs.use_elastic_search || inputs.use_memcached ||  inputs.use_redis || inputs.use_rabbitmq || inputs.use_mongo
        with:
          use_mongo: ${{ inputs.use_mongo }}
          use_redis: ${{ inputs.use_redis }}
          use_postgres: ${{ inputs.use_postgres }}
          use_elastic_search: ${{ inputs.use_elastic_search }}
          use_memcached: ${{ inputs.use_memcached }}
          use_rabbitmq: ${{ inputs.use_rabbitmq }}
          postgres_db: ${{ inputs.postgres_db }}
          postgres_user: ${{ inputs.postgres_user }}
          postgres_password: ${{ inputs.postgres_password }}
          postgres_version: ${{ inputs.postgres_version }}
          mongo_version: ${{ inputs.mongo_version }}
          elasticsearch_version:  ${{ inputs.elasticsearch_version }}
          elasticsearch_port: ${{ inputs.elasticsearch_port }}
          memcached_version:  ${{ inputs.memcached_version }}
          redis_version:  ${{ inputs.redis_version }}
          rabbitmq_version:  ${{ inputs.rabbitmq_version }}

      - name: Start celery worker
        if: inputs.use_celery
        run: |
          celery -A ${{ inputs.celery_app }} worker -E -c 1 -n worker -Q ${{ inputs.celery_queues }} --detach
        working-directory: ${{ inputs.working_directory }}

      - name: Cache Database State
        id: db-cache
        if: inputs.use_db_snapshot
        uses: actions/cache@v5
        with:
          path: db-snapshot.sql
          key: ${{ runner.os }}-db-${{ github.event_name }}-${{ hashFiles('**/migrations/0*.py') }}
          # Newest push (warm-up) snapshot only, never an older PR one that could hold a since-edited migration.
          restore-keys: ${{ runner.os }}-db-push-

      - name: Restore Database from Cache
        # An exact or restore-keys match both leave the snapshot on disk.
        if: inputs.use_db_snapshot && hashFiles('db-snapshot.sql') != ''
        run: |
          # Seeds the live and test DB so `--keepdb` skips migrations; `-i` is required or the redirect is a silent no-op.
          docker exec -i postgres psql -U "$PG_USER" -d "$PG_DB" < db-snapshot.sql
          # A migration applied in the snapshot but gone from disk (renamed, squashed): migrate from zero instead.
          find . -path ./.venv -prune -o -path '*/migrations/0*.py' -print | awk -F/ '{sub(/\.py$/, "", $NF); print $(NF-2) "/" $NF}' | sort > "$RUNNER_TEMP/on_disk"
          apps=$(cut -d/ -f1 "$RUNNER_TEMP/on_disk" | sort -u | paste -sd'|')
          stale=$(docker exec postgres psql -U "$PG_USER" -d "$PG_DB" -Atc "SELECT app || '/' || name FROM django_migrations" \
            | awk -v re="^($apps)/" '$0 ~ re' | sort | comm -23 - "$RUNNER_TEMP/on_disk")
          if [[ -n "$stale" ]]; then
            echo "::notice::DB snapshot holds migrations missing on disk, migrating from zero: $stale"
            docker exec postgres dropdb -U "$PG_USER" "$PG_DB"
            docker exec postgres createdb -U "$PG_USER" "$PG_DB"
            exit 0
          fi
          docker exec postgres createdb -U "$PG_USER" "test_${PG_DB}" || true
          docker exec -i postgres psql -U "$PG_USER" -d "test_${PG_DB}" < db-snapshot.sql
        env:
          PG_USER: ${{ inputs.postgres_user }}
          PG_DB: ${{ inputs.postgres_db }}
        shell: bash

      - name: Run custom command
        if: inputs.custom_command
        run: |
          COMMAND='${{ inputs.custom_command }}'
          echo "Running command: $COMMAND"
          eval $COMMAND
        working-directory: ${{ inputs.working_directory }}
        shell: bash

      - name: Store cache
        if: inputs.use_db_snapshot && steps.db-cache.outputs.cache-hit != 'true'
        run: |
          docker exec postgres pg_dump -U "$PG_USER" -d "$PG_DB" > db-snapshot.sql
          # Seed the test DB too, so `--keepdb` skips migrations on this cache-miss run as well.
          docker exec postgres dropdb -U "$PG_USER" --if-exists "test_${PG_DB}"
          docker exec postgres createdb -U "$PG_USER" "test_${PG_DB}"
          docker exec -i postgres psql -U "$PG_USER" -d "test_${PG_DB}" < db-snapshot.sql
        env:
          PG_USER: ${{ inputs.postgres_user }}
          PG_DB: ${{ inputs.postgres_db }}
        shell: bash

      - name: Check migrations
        if: inputs.run_tests && inputs.check_migrations && inputs.django_settings_module
        run: |
          django-admin makemigrations --dry-run >/dev/null
        working-directory: ${{ inputs.working_directory }}
        shell: bash

      - name: Run unittest
        if: inputs.run_tests
        run: |
          CMD="python"
          if [[ '${{ inputs.use_coverage }}' != 'false' ]]; then
              CMD="coverage run --rcfile=${{ inputs.coverage_config_path }}"
          
              if [[ -n '${{ inputs.django_settings_module }}' ]]; then
                # No '-a' (append): it is incompatible with coverage parallel
                # mode (concurrency=multiprocessing / parallel=true) used by
                # projects that run the Django test suite with --parallel.
                # A single coverage run does not need append anyway.
                CMD="${CMD} manage.py test"
                if [[ '${{ inputs.use_db_snapshot }}' == 'true' ]]; then
                  CMD="${CMD} --keepdb"
                fi
                if [[ -n '${{ inputs.test_parallelism }}' ]]; then
                  CMD="${CMD} --parallel=${{ inputs.test_parallelism }}"
                fi
                # manage manual tags
                if [[ -n '${{ inputs.tags_for_manual_tests }}' ]]; then
                  for tag in ${{ inputs.tags_for_manual_tests }}; do
                    CMD="${CMD} --exclude-tag=$tag"
                  done
                fi
                # manage slow tags
                if [[ '${{ github.base_ref }}' != 'master' && '${{ github.base_ref }}' != 'main' ]]; then
                  if [[ -n '${{ inputs.tags_for_slow_tests }}' ]]; then
                    for tag in ${{ inputs.tags_for_slow_tests }}; do
                      CMD="${CMD} --exclude-tag=$tag"
                    done
                  fi
                fi
          
              else
                CMD="${CMD} -m unittest discover"
              fi

          else
            CMD="python -m unittest discover"
          fi
          CMD="${CMD} --failfast"
          echo "Running command: ${CMD}"
          $CMD
        working-directory: ${{ inputs.working_directory }}
        env: ${{ secrets }}
        shell: bash

      - name: Combine coverage data
        if: inputs.run_tests && inputs.use_coverage && inputs.upload_coverage
        run: |
          # When coverage runs in parallel mode (concurrency=multiprocessing),
          # each worker process writes its own .coverage.* file; merge them
          # before reporting. No-op for projects not using parallel coverage.
          if ls .coverage.* >/dev/null 2>&1; then
            coverage combine
          fi
        working-directory: ${{ inputs.working_directory }}
        shell: bash

      - name: Create coverage output
        if: inputs.run_tests && inputs.use_coverage && inputs.upload_coverage
        id: coverage-output
        run: |
          echo "Uploading coverage.py report"
          echo "## Coverage.py report" >> $GITHUB_STEP_SUMMARY
          echo "$(coverage report -m --format=markdown)" >> $GITHUB_STEP_SUMMARY
        working-directory: ${{ inputs.working_directory }}
